name: Release

# A tag of the form v1.2.3 publishes a release: the tests first, then a release
# build, a zip and a DMG with their SHA-256 sums, a GitHub Release carrying them
# plus generated notes, and the cask update in armandrt/homebrew-tap.
#
# Nothing here signs with a Developer ID or notarises, because both need a paid
# Apple Developer Program membership. The notes say so and tell a downloader
# what to do about the quarantine flag; see .github/release-notes.md.
#
# Cost: as in ci.yml, macOS runner minutes bill at 10x against a private
# repository's included minutes. One release is a few of them either way.

on:
  push:
    tags: ['v*']

permissions:
  contents: write       # creating the release and uploading its assets

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build, package and publish
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # scripts/make-app.sh uses the commit count as CFBundleVersion; the
          # default shallow clone would make every release "build 1".
          fetch-depth: 0

      - name: Version from the tag
        id: version
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "release: tag '$TAG' is not v<major>.<minor>.<patch>" >&2
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Record the toolchain
        run: |
          set -euo pipefail
          xcode-select -p
          swift --version

      - name: Tests
        # A tag whose tests fail never becomes a release. No cache on this
        # workflow on purpose: what ships is built from nothing.
        run: ./scripts/test.sh

      - name: Package
        # scripts/release.sh: `make-app.sh --release` at this version, then
        # dist/ClaudeAccountSwitcher-<version>.zip (ditto -c -k --keepParent),
        # dist/ClaudeAccountSwitcher-<version>.dmg (hdiutil, app + /Applications
        # symlink) and dist/SHA256SUMS.txt.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/release.sh "$VERSION"

      - name: Checksums
        id: sums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          DIST="$GITHUB_WORKSPACE/dist"
          for FILE in "ClaudeAccountSwitcher-$VERSION.zip" "ClaudeAccountSwitcher-$VERSION.dmg" "SHA256SUMS.txt"; do
            test -s "$DIST/$FILE" || { echo "release: $DIST/$FILE is missing or empty" >&2; exit 1; }
          done
          ZIP_SHA256="$(awk -v f="ClaudeAccountSwitcher-$VERSION.zip" '$2 == f {print $1}' "$DIST/SHA256SUMS.txt")"
          DMG_SHA256="$(awk -v f="ClaudeAccountSwitcher-$VERSION.dmg" '$2 == f {print $1}' "$DIST/SHA256SUMS.txt")"
          for SUM in "$ZIP_SHA256" "$DMG_SHA256"; do
            printf '%s' "$SUM" | grep -Eq '^[0-9a-f]{64}$' || { echo "release: bad checksum in SHA256SUMS.txt" >&2; exit 1; }
          done
          {
            echo "zip_sha256=$ZIP_SHA256"
            echo "dmg_sha256=$DMG_SHA256"
          } >> "$GITHUB_OUTPUT"
          cat "$DIST/SHA256SUMS.txt"

      - name: Render the cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ZIP_SHA256: ${{ steps.sums.outputs.zip_sha256 }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/scripts/update-cask.sh" "$VERSION" \
            --sha256 "$ZIP_SHA256" \
            --output "$RUNNER_TEMP/claude-account-switcher.rb"

      - name: Compose the notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP_SHA256: ${{ steps.sums.outputs.zip_sha256 }}
          DMG_SHA256: ${{ steps.sums.outputs.dmg_sha256 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/notes.md"
          sed -e '/^<!--/,/-->$/d' \
              -e "s/@VERSION@/$VERSION/g" \
              -e "s/@ZIP_SHA256@/$ZIP_SHA256/g" \
              -e "s/@DMG_SHA256@/$DMG_SHA256/g" \
              "$GITHUB_WORKSPACE/.github/release-notes.md" > "$NOTES"
          # GitHub's own generated notes (merged PRs, commits since the previous
          # tag), appended under whatever heading it uses.
          GENERATED="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f "tag_name=$TAG" --jq .body || true)"
          if [ -n "$GENERATED" ]; then
            printf -- '\n---\n\n%s\n' "$GENERATED" >> "$NOTES"
          else
            echo "release: no generated notes came back for $TAG" >&2
          fi
          cat "$NOTES" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DIST="$GITHUB_WORKSPACE/dist"
          ASSETS=(
            "$DIST/ClaudeAccountSwitcher-$VERSION.zip"
            "$DIST/ClaudeAccountSwitcher-$VERSION.dmg"
            "$DIST/SHA256SUMS.txt"
            "$RUNNER_TEMP/claude-account-switcher.rb"
          )
          # Re-running a tag's workflow replaces the assets instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "Claude Account Switcher $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Claude Account Switcher $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag
          fi

      - name: Update the tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ZIP_SHA256: ${{ steps.sums.outputs.zip_sha256 }}
          TAP_REPOSITORY: armandrt/homebrew-tap
          # GITHUB_TOKEN is scoped to this repository and cannot write to the
          # tap, so this needs a fine-grained personal access token with
          # Contents: read and write on armandrt/homebrew-tap only, stored as
          # the TAP_TOKEN secret. Without it the step prints the two commands
          # to run by hand and exits 0.
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          CASK="$RUNNER_TEMP/claude-account-switcher.rb"
          CASK_PATH="Casks/claude-account-switcher.rb"
          if [ -z "${TAP_TOKEN:-}" ]; then
            {
              echo '### The tap was not updated'
              echo
              echo "No TAP_TOKEN secret is set, so $TAP_REPOSITORY still points at the previous"
              echo 'release. The rendered cask is attached to this release; or, from a checkout of'
              echo 'this repository, with the tap checked out at ~/src/homebrew-tap:'
              echo
              echo '```sh'
              echo "scripts/update-cask.sh $VERSION --sha256 $ZIP_SHA256 --output ~/src/homebrew-tap/$CASK_PATH"
              echo "git -C ~/src/homebrew-tap commit -am 'claude-account-switcher $VERSION' && git -C ~/src/homebrew-tap push"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Through the contents API rather than a clone: no token in a remote
          # URL, no git identity to invent, and one call either way.
          BLOB="$(GH_TOKEN="$TAP_TOKEN" gh api "repos/$TAP_REPOSITORY/contents/$CASK_PATH" --jq .sha 2>/dev/null || true)"
          ARGUMENTS=(
            -f "message=claude-account-switcher $VERSION"
            -f "content=$(base64 < "$CASK" | tr -d '\n')"
          )
          if [ -n "$BLOB" ]; then
            ARGUMENTS+=(-f "sha=$BLOB")      # updating the file, not creating it
          fi
          COMMIT="$(GH_TOKEN="$TAP_TOKEN" gh api --method PUT \
            "repos/$TAP_REPOSITORY/contents/$CASK_PATH" "${ARGUMENTS[@]}" --jq .commit.html_url)"
          echo "release: tap updated — $COMMIT"
          {
            echo '### Tap updated'
            echo
            echo "[$TAP_REPOSITORY/$CASK_PATH]($COMMIT) now installs $VERSION."
          } >> "$GITHUB_STEP_SUMMARY"
